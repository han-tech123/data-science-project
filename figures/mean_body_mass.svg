<text x="40.0" y="82.0" font-family="Arial, sans-serif" font-size="15" fill="#52677B" text-anchor="start" font-weight="normal">Palmer Penguins • measured birds only; whiskers = ±1 standard deviation</text>
<line x1="175.0" y1="112" x2="175.0" y2="357" stroke="#D9E2EB"/>
