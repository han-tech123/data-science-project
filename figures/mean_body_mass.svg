<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Average body mass by species</title>
<desc id="desc">Horizontal bars show mean body mass in grams. Thin whiskers show plus or minus one standard deviation. Gentoo has the highest mean.</desc>
<rect width="900" height="450" fill="#F7F9FC"/>
